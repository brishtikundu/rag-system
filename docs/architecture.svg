<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="470" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">RAG System Architecture</text>

  <text x="30" y="82" font-size="14" font-weight="700" fill="#2563eb">1 · INGESTION (on PDF upload)</text>
  <g font-size="13" text-anchor="middle" fill="#0f172a">
    <rect x="30" y="95" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="105" y="125" font-weight="600">Upload PDFs</text><text x="105" y="145" font-size="11" fill="#475569">Streamlit uploader</text>

    <rect x="230" y="95" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="305" y="125" font-weight="600">Load PDFs</text><text x="305" y="145" font-size="11" fill="#475569">PyPDFDirectoryLoader</text>

    <rect x="430" y="95" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="505" y="125" font-weight="600">Split into chunks</text><text x="505" y="145" font-size="11" fill="#475569">size 1000 / overlap 200</text>

    <rect x="630" y="95" width="115" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="687" y="125" font-weight="600">Embed</text><text x="687" y="145" font-size="11" fill="#475569">Google Gemini</text>

    <rect x="770" y="95" width="105" height="70" rx="10" fill="#bfdbfe" stroke="#1d4ed8"/>
    <text x="822" y="125" font-weight="600">Vector store</text><text x="822" y="145" font-size="11" fill="#475569">InMemory</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="180" y1="130" x2="228" y2="130"/>
    <line x1="380" y1="130" x2="428" y2="130"/>
    <line x1="580" y1="130" x2="628" y2="130"/>
    <line x1="745" y1="130" x2="768" y2="130"/>
  </g>

  <text x="30" y="225" font-size="14" font-weight="700" fill="#16a34a">2 · QUESTION ANSWERING (chat)</text>
  <g font-size="13" text-anchor="middle" fill="#0f172a">
    <rect x="30" y="245" width="150" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="105" y="278" font-weight="600">User question</text><text x="105" y="298" font-size="11" fill="#475569">Streamlit chat UI</text>

    <rect x="260" y="245" width="190" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="355" y="272" font-weight="600">LangGraph Agent</text><text x="355" y="291" font-size="11" fill="#475569">create_agent + memory</text><text x="355" y="307" font-size="11" fill="#475569">(InMemorySaver)</text>

    <rect x="530" y="245" width="170" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="615" y="272" font-weight="600">retrieve_docs tool</text><text x="615" y="291" font-size="11" fill="#475569">top-3 similarity search</text><text x="615" y="307" font-size="11" fill="#475569">over the vector store</text>

    <rect x="260" y="375" width="190" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="355" y="404" font-weight="600">Groq LLM</text><text x="355" y="424" font-size="11" fill="#475569">gpt-oss-20b</text>

    <rect x="30" y="375" width="150" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="105" y="404" font-weight="600">Answer</text><text x="105" y="424" font-size="11" fill="#475569">shown in chat</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="180" y1="285" x2="258" y2="285"/>
    <line x1="450" y1="275" x2="528" y2="275"/>
    <line x1="528" y1="300" x2="452" y2="300"/>
    <line x1="355" y1="325" x2="355" y2="373"/>
    <line x1="258" y1="410" x2="182" y2="410"/>
    <path d="M822 167 V285 H702" stroke-dasharray="6 4"/>
  </g>
  <text x="840" y="230" font-size="11" fill="#475569" text-anchor="middle">chunks</text>
</svg>
